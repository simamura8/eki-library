  </header>
  <main>
    <section class="intro"><div><p class="eyebrow">言葉に、すぐ辿りつく。</p><h1>今日、ひらく一爻。</h1><p class="subtle">卦を選び、爻をひらく。原文と意味、そして伏卦まで。</p></div><div class="intro-mark" aria-hidden="true">☰<span>☷</span></div></section>
    <section class="search-section" aria-label="卦と爻を検索">
      <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="卦名・番号・言葉で探す　例：兌為沢3爻、58-3、潜龍" autocomplete="off" aria-label="卦名、番号、本文で検索"><kbd>/</kbd></div>

    </section>
    <div class="workspace">

    </div>
    <footer><span>易経大講座より · 個人用閲覧室</span><span>占例を除く、卦辞・爻辞・意味・伏卦を収録</span></footer>
